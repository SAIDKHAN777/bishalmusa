openapi: 3.0.3
info:
  title: Said Khan Portfolio Backend API
  version: 1.0.0
  description: High-performance portfolio backend, content services, blog system, and admin platform API specification.
servers:
  - url: http://localhost:4322
    description: Local development server
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /api/admin/auth/login:
    post:
      summary: Admin login
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /api/admin/auth/logout:
    post:
      summary: Admin logout
      responses:
        '200':
          description: Logout successful
  /api/admin/auth/me:
    get:
      summary: Get current authenticated admin user
      responses:
        '200':
          description: Active session
        '401':
          description: Unauthorized
  /api/projects:
    get:
      summary: List published projects
      responses:
        '200':
          description: Paginated published projects
  /api/projects/{slug}:
    get:
      summary: Get published project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
        '404':
          description: Project not found
  /api/blog:
    get:
      summary: List published blog posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: tag
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated published blog articles
  /api/blog/{slug}:
    get:
      summary: Get published blog post by slug with sanitized HTML
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog post details with rendered HTML
        '404':
          description: Blog post not found or draft
  /api/tags:
    get:
      summary: List blog tags
      responses:
        '200':
          description: List of tags with article counts
  /api/categories:
    get:
      summary: List categories
      responses:
        '200':
          description: List of project categories
  /api/skills:
    get:
      summary: List skills
      responses:
        '200':
          description: List of skills
  /api/services:
    get:
      summary: List active services
      responses:
        '200':
          description: List of service offerings
  /api/experience:
    get:
      summary: List work experience
      responses:
        '200':
          description: List of career experiences
  /api/education:
    get:
      summary: List educational credentials
      responses:
        '200':
          description: List of education records
  /api/testimonials:
    get:
      summary: List approved testimonials
      responses:
        '200':
          description: List of approved client testimonials
  /api/settings:
    get:
      summary: Get public site settings
      responses:
        '200':
          description: Public site configurations
  /api/admin/blog:
    get:
      summary: List all blog posts (admin)
      responses:
        '200':
          description: All blog posts including drafts
        '401':
          description: Unauthorized
    post:
      summary: Create blog post
      responses:
        '201':
          description: Blog post created
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/admin/blog/{id}:
    get:
      summary: Get blog post by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details
    put:
      summary: Update blog post
      responses:
        '200':
          description: Post updated
    delete:
      summary: Delete blog post
      responses:
        '200':
          description: Post deleted
  /api/admin/tags:
    get:
      summary: List all tags
      responses:
        '200':
          description: All tags
    post:
      summary: Create tag
      responses:
        '201':
          description: Tag created
  /api/admin/tags/{id}:
    delete:
      summary: Delete tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag deleted
  /api/admin/projects:
    get:
      summary: List all projects (admin)
      responses:
        '200':
          description: All projects including drafts
    post:
      summary: Create project
      responses:
        '201':
          description: Project created
  /api/admin/projects/{id}:
    get:
      summary: Get project by id
      responses:
        '200':
          description: Project details
    put:
      summary: Update project
      responses:
        '200':
          description: Project updated
    delete:
      summary: Soft-delete project
      responses:
        '200':
          description: Project deleted
  /api/admin/categories:
    get:
      summary: List categories (admin)
      responses:
        '200':
          description: List categories
    post:
      summary: Create category
      responses:
        '201':
          description: Category created
  /api/admin/categories/{id}:
    put:
      summary: Update category
      responses:
        '200':
          description: Category updated
    delete:
      summary: Delete category
      responses:
        '200':
          description: Category deleted
  /api/admin/skills:
    get:
      summary: List skills (admin)
      responses:
        '200':
          description: List of skills
    post:
      summary: Create skill
      responses:
        '201':
          description: Skill created
  /api/admin/skills/{id}:
    put:
      summary: Update skill
      responses:
        '200':
          description: Skill updated
    delete:
      summary: Delete skill
      responses:
        '200':
          description: Skill deleted
  /api/admin/services:
    get:
      summary: List services (admin)
      responses:
        '200':
          description: List of services
    post:
      summary: Create service
      responses:
        '201':
          description: Service created
  /api/admin/services/{id}:
    put:
      summary: Update service
      responses:
        '200':
          description: Service updated
    delete:
      summary: Delete service
      responses:
        '200':
          description: Service deleted
  /api/admin/experience:
    get:
      summary: List experience (admin)
      responses:
        '200':
          description: List of experience records
    post:
      summary: Create experience
      responses:
        '201':
          description: Experience created
  /api/admin/experience/{id}:
    put:
      summary: Update experience
      responses:
        '200':
          description: Experience updated
    delete:
      summary: Delete experience
      responses:
        '200':
          description: Experience deleted
  /api/admin/education:
    get:
      summary: List education (admin)
      responses:
        '200':
          description: List of education records
    post:
      summary: Create education
      responses:
        '201':
          description: Education created
  /api/admin/education/{id}:
    put:
      summary: Update education
      responses:
        '200':
          description: Education updated
    delete:
      summary: Delete education
      responses:
        '200':
          description: Education deleted
  /api/admin/testimonials:
    get:
      summary: List testimonials (admin)
      responses:
        '200':
          description: List testimonials
    post:
      summary: Create testimonial
      responses:
        '201':
          description: Testimonial created
  /api/admin/testimonials/{id}:
    put:
      summary: Update testimonial
      responses:
        '200':
          description: Testimonial updated
    delete:
      summary: Delete testimonial
      responses:
        '200':
          description: Testimonial deleted
  /api/admin/settings:
    get:
      summary: Get full site settings
      responses:
        '200':
          description: Full site configuration
    put:
      summary: Update site settings
      responses:
        '200':
          description: Settings updated
  /api/contact:
    post:
      summary: Submit contact form message
      description: Validates contact details, checks honeypot & Turnstile, applies IP rate-limiting, stores message and enqueues BullMQ notification job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@example.com
                subject:
                  type: string
                  example: Project Collaboration
                message:
                  type: string
                  example: Hello Said, I would like to discuss building an enterprise platform.
                website_url_check:
                  type: string
                  description: Honeypot field (must be omitted or empty)
                turnstileToken:
                  type: string
                  description: Cloudflare Turnstile verification token
      responses:
        '201':
          description: Contact message received and queued
        '400':
          description: Validation or CAPTCHA failure
        '429':
          description: Rate limit exceeded (max 3 submissions per hour per IP)
  /api/admin/messages:
    get:
      summary: List contact messages (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: isRead
          in: query
          schema:
            type: boolean
        - name: isSpam
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated contact messages
        '401':
          description: Unauthorized
  /api/admin/messages/{id}:
    get:
      summary: Get single contact message by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contact message details
        '404':
          description: Message not found
    patch:
      summary: Update contact message status (mark read or mark spam)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isRead:
                  type: boolean
                isSpam:
                  type: boolean
      responses:
        '200':
          description: Contact message updated
        '404':
          description: Message not found
    delete:
      summary: Soft delete contact message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contact message deleted
        '404':
          description: Message not found
  /api/admin/media/upload:
    post:
      summary: Upload media asset (image or PDF document)
      description: Validates file MIME type and byte size, uploads to Cloudinary storage, generates auto-format & auto-quality URLs, and registers asset in Media table.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File payload (JPEG, PNG, WEBP, GIF, SVG <= 10MB or PDF <= 15MB)
                altText:
                  type: string
                  description: Optional accessible image description
      responses:
        '201':
          description: Media uploaded successfully
        '400':
          description: Unsupported file format or file size exceeded
        '401':
          description: Unauthorized
  /api/admin/media:
    get:
      summary: List media assets (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: resourceType
          in: query
          schema:
            type: string
            enum: [image, raw]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated media list
        '401':
          description: Unauthorized
  /api/admin/media/{id}:
    get:
      summary: Get single media asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: width
          in: query
          schema:
            type: integer
        - name: height
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Media asset details with optimized delivery URL
        '404':
          description: Media not found
    patch:
      summary: Update media metadata (alt text)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                altText:
                  type: string
      responses:
        '200':
          description: Media updated
        '404':
          description: Media not found
    delete:
      summary: Delete media asset from Cloudinary and database
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media deleted successfully
        '404':
          description: Media not found
  /api/resume/download:
    get:
      summary: Track resume download and redirect to file
      description: Records anonymous download analytics (hashed IP, timestamp, referrer) and redirects (302) to resume asset.
      responses:
        '302':
          description: Redirecting to resume file
          headers:
            Location:
              schema:
                type: string
  /api/analytics/pageview:
    post:
      summary: Record privacy-friendly page view
      description: Ingests beacon page view, filters bots, hashes IP/User-Agent, and records path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  example: /blog/building-distributed-systems
                referrer:
                  type: string
                  example: https://google.com
      responses:
        '200':
          description: Page view processed (recorded or bot ignored)
        '400':
          description: Invalid payload
  /api/analytics/project-click:
    post:
      summary: Record project link interaction click
      description: Records user interaction with Demo or GitHub buttons for a specific project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
                type:
                  type: string
                  enum: [DEMO, GITHUB]
                  default: DEMO
      responses:
        '200':
          description: Project click recorded
        '404':
          description: Project not found
  /api/admin/analytics/stats:
    get:
      summary: Get aggregated analytics statistics (admin only)
      description: Returns view count trends, top pages, project clicks, unique visitors, and resume downloads.
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        '200':
          description: Aggregated analytics metrics
        '401':
          description: Unauthorized
  /sitemap.xml:
    get:
      summary: Dynamic XML sitemap
      description: Returns valid XML sitemap indexing all published projects, published blog posts, and core pages.
      responses:
        '200':
          description: Standard XML Sitemap
          content:
            application/xml:
              schema:
                type: string
  /robots.txt:
    get:
      summary: Dynamic robots.txt
      description: Returns dynamic search crawler directives pointing to sitemap.xml.
      responses:
        '200':
          description: robots.txt directives
          content:
            text/plain:
              schema:
                type: string
  /rss.xml:
    get:
      summary: Dynamic RSS 2.0 blog feed
      description: Returns valid RSS 2.0 XML feed of recent published blog posts.
      responses:
        '200':
          description: RSS 2.0 XML feed
          content:
            application/xml:
              schema:
                type: string
