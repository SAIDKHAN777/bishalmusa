version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_root_pass}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_backend_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio_backend_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Job Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  # ----------------------------------------------------------------------------
  # Astro Web Server & CMS API
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4322
      HOST: 0.0.0.0
      SITE_URL: ${SITE_URL:-http://localhost:4322}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_local_root_pass}@postgres:5432/${POSTGRES_DB:-portfolio_backend_db}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-super_secret_session_key_minimum_32_characters_long_12345}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@saidkhan.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SuperSecretAdminPassword123!}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo_cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-123456789012345}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-sample_cloudinary_api_secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-contact@saidkhan.dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-internal_privacy_salt_hash_random_key_minimum_32_chars}
    ports:
      - '4322:4322'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_net

  # ----------------------------------------------------------------------------
  # BullMQ Background Worker (Email, Telegram, Analytics Pruning)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_worker
    restart: unless-stopped
    command: ['node', '-e', 'require("./dist/server/entry.mjs")'] # or tsx worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_local_root_pass}@postgres:5432/${POSTGRES_DB:-portfolio_backend_db}
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@saidkhan.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SuperSecretAdminPassword123!}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-contact@saidkhan.dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-super_secret_session_key_minimum_32_characters_long_12345}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-internal_privacy_salt_hash_random_key_minimum_32_chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
